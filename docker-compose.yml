version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: savevest-engine-api
    ports:
      - "3333:3333"
    volumes:
      - ./build:/app/build
      - ./bin:/app/bin
      - ./config:/app/config
      - ./uploads:/app/uploads
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./ace.js:/app/ace.js
      - ./adonisrc.ts:/app/adonisrc.ts
      - ./start:/app/start
      - ./app:/app/app
      - ./database:/app/database
      - ./providers:/app/providers
      - ./tests:/app/tests
      - ./public:/app/public
      - ../.env:/app/.env:ro
    command: ["node", "./bin/server.js"]
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    # Add depends_on for db/redis if needed

